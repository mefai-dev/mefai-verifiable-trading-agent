    <rect x="250" y="198" width="190" height="48" rx="8"/>
    <rect x="460" y="198" width="190" height="48" rx="8"/>
    <rect x="670" y="198" width="210" height="48" rx="8"/>
  </g>
  <g fill="#e6e8ea" font-size="12" text-anchor="middle">
