  <text x="460" y="582" fill="#5b636b" font-size="10" text-anchor="middle">Ships in paper mode · signs nothing until BNBHACK_EXECUTE_TRADES and BNBHACK_EXECUTE_CHAIN are both set</text>

  <defs>
