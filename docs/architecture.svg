  <text x="460" y="336" fill="#848e9c" font-size="10" text-anchor="middle">honeypot · contract risk · slippage · approval guard · preflight · MEV · (Trust Wallet Agent Kit)</text>

  <path d="M460 346 L460 368" stroke="#F0B90B" stroke-width="2" marker-end="url(#a)"/>

