# nginx snippet for the MEFAI BNB HACK agent backend.
# Place the two map{} blocks and the limit_req_zone in the http{} block, the
# location blocks in the site server{} block. The backend listens only on
# 127.0.0.1:8401; nginx is the sole public ingress. The x402 feed is
# intentionally NOT key-gated (payment is the gate) and must forward the
# X-PAYMENT header and expose X-PAYMENT-RESPONSE.
#
# Production posture (faithful to the live site): every read-only endpoint
# advertised in the ERC-8004 agent card, the README and the docs pages stays
# OPEN so a judge or another agent can verify the live system directly with
# curl (no header, no referer needed; all still rate limited per IP). The
# compute-heavy POST routes (fusion, sizing, compose, security/evaluate, twak
# previews) are referer gated to a mefai.io page so off-site bots cannot spin
# up compute · they return 403 when the Referer is not an mefai.io page.

# --- http{} block ---
# limit_req_zone $binary_remote_addr zone=bnbhack:10m rate=10r/s;

# Referer gate: the SPA fetch() always sends a Referer from an mefai.io page;
# external curl/scripts will lack it.
# map $http_referer $mefai_referer_ok {
#     default               0;
#     ~*^https?://mefai\.io 1;
# }

# Which /bnbhack-api/ paths require the referer. 1 = gated (default, the compute
# POST routes), 0 = open read endpoints listed below. A path needs the referer
# only when $bnbhack_needs_ref is 1 AND $mefai_referer_ok is 0 (see the gate
# string in the location block).
# map $uri $bnbhack_needs_ref {
#     default                            1;
#     ~^/bnbhack-api/loop/state          0;
#     ~^/bnbhack-api/agent-card          0;
#     ~^/bnbhack-api/agent/identity      0;
#     ~^/bnbhack-api/leaderboard         0;
#     ~^/bnbhack-api/uvii                0;
#     ~^/bnbhack-api/tp-sl               0;
#     ~^/bnbhack-api/backtest            0;
#     ~^/bnbhack-api/x402/products       0;
#     ~^/bnbhack-api/x402/cmc-challenge  0;
#     ~^/bnbhack-api/signals/recent      0;
#     ~^/bnbhack-api/cmc/                0;
# }

# --- server{} block ---
location ^~ /bnbhack-api/ {
    limit_req zone=bnbhack burst=20 nodelay;
    limit_except GET POST { deny all; }
    client_max_body_size 64k;

    # Compute POST routes (/fusion /sizing /compose /security/evaluate /twak)
    # are referer-gated in production; the read endpoints in the map above stay
    # open. Gate fires only when the path needs a referer (1) and the referer is
    # not an mefai.io page (0), i.e. the concatenated string is exactly "10".
    set $bnbhack_gate "$bnbhack_needs_ref$mefai_referer_ok";
    if ($bnbhack_gate = "10") { return 403; }

    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    # Defence: never honour a client-supplied backend Authorization header.
    proxy_set_header Authorization "";

    proxy_pass http://127.0.0.1:8401/;
    proxy_read_timeout 30s;
}

# x402 commerce edge: no injected key, payment header passes through.
location ^~ /bnbhack-x402/ {
    limit_req zone=bnbhack burst=20 nodelay;
    limit_except GET POST { deny all; }
    client_max_body_size 64k;

    proxy_set_header X-PAYMENT $http_x_payment;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass_header X-PAYMENT-RESPONSE;

    proxy_pass http://127.0.0.1:8401/x402/;
    proxy_read_timeout 30s;
}
