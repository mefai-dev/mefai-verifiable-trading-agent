# nginx snippet for the MEFAI BNB HACK agent backend.
# Place the limit_req_zone in the http{} block, the location blocks in the site
# server{} block. The backend listens only on 127.0.0.1:8401; nginx is the sole
# public ingress. The data API key is injected here, server-side, so the browser
# never sees it. The x402 feed is intentionally NOT key-gated (payment is the
# gate) and must forward the X-PAYMENT header and expose X-PAYMENT-RESPONSE.

# --- http{} block ---
# limit_req_zone $binary_remote_addr zone=bnbhack:10m rate=10r/s;

# --- server{} block ---
location ^~ /bnbhack-api/ {
    limit_req zone=bnbhack burst=20 nodelay;
    client_max_body_size 64k;

    # Inject the shared data key server-side (read-only data endpoints).
    proxy_set_header X-API-Key "REPLACE_WITH_BNBHACK_API_KEY";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;

    proxy_pass http://127.0.0.1:8401/;
    proxy_read_timeout 30s;
}

# x402 commerce edge: no injected key, payment header passes through.
location ^~ /bnbhack-x402/ {
    limit_req zone=bnbhack burst=20 nodelay;
    client_max_body_size 64k;

    proxy_set_header X-PAYMENT $http_x_payment;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass_header X-PAYMENT-RESPONSE;

    proxy_pass http://127.0.0.1:8401/x402/;
    proxy_read_timeout 30s;
}
